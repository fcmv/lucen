site_name: Lucen
site_description: Comment-pragma parallelization for ordinary Python, never an incorrect result.
repo_url: https://github.com/fcmv/lucen
repo_name: fcmv/lucen
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

plugins:
  - search
  # The guides below live at the repository root so GitHub and the sdist show
  # them; this pulls them into the site rather than linking back out.
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: false
            members_order: source
            show_root_heading: true

hooks:
  - tools/mkdocs_root_links.py

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Guides:
      - Limitations: limitations.md
      - Benchmarks: benchmark.md
      - Stability policy: stability.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md
  - Reference:
      - Architecture: architecture.md
      - Pragmas and clauses: pragmas.md
      - API: api.md
      - Glossary: glossary.md
      - Paper: paper/lucen.md
      - Technical specification: spec/lucen_technical_spec.md
      - Engineering guide: implementation/lucen_engineering_doc.md
      - Formal specifications: formal/README.md
      - Architecture decisions: adr/README.md
  - Project:
      - Getting support: support.md
      - Contributing: contributing.md
