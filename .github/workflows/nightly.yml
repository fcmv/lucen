name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  # A large-budget run of the property and fuzz suites. The dev profile runs a
  # small example budget on every PR; this lane runs the nightly profile so a
  # rare counterexample has time to be found.
  extended-fuzz:
    name: extended fuzz (nightly budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest hypothesis
          maturin build --release --out dist
          pip install --no-index --find-links dist lucen
      - name: Run property and fuzz suites at nightly budget
        env:
          HYPOTHESIS_PROFILE: nightly
        run: pytest -q tests/property

      - name: Run the same suites on the pure-Python fallback
        env:
          HYPOTHESIS_PROFILE: nightly
          LUCEN_DISABLE_NATIVE: "1"
        run: pytest -q tests/property

  miri:
    name: miri (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: cargo miri test
        run: cargo miri test --manifest-path lucen_core/Cargo.toml

  # Records the full benchmark as an artifact (the historical performance log)
  # and compares the machine-independent speedup ratios against the committed
  # baseline. Correctness regressions are fatal; a speedup drop is reported.
  # The absolute-speedup magnitude depends on the runner core count, so the
  # hard regression gate is the speedup-floor test in the main suite.
  perf-tracking:
    name: perf tracking (record + compare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest hypothesis
          maturin build --release --out dist
          pip install --no-index --find-links dist lucen
      - name: Run benchmark and compare to baseline
        env:
          PYTHONPATH: tests/benchmarks
        run: |
          python tests/benchmarks/matrix_bench.py bench-current.json
          python tests/benchmarks/compare_baseline.py \
            tests/benchmarks/results/py311.json bench-current.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_number }}
          path: bench-current.json

  # Mutation testing on the correctness core: inject one change per mutant and
  # check the suite kills it. It runs against the source (editable install) so
  # mutants are actually seen. Non gating and time bounded; survivors (mutations
  # no test killed) are uploaded for triage. Some survivors are equivalent
  # mutants, so the report is a review queue, not a score to defend.
  #
  # Both accel modes are mutated, because pinning one makes the other dead code:
  # under LUCEN_DISABLE_NATIVE every mutant of _accel.py and of the accelerated
  # branch in audit_disjoint_dict_slabs reports as a survivor no test could ever
  # have killed. A mutant is only a real survivor if it survived in both lanes,
  # so triage intersects the two artifacts. The lanes run in parallel, which
  # keeps each one inside the same budget the single lane had.
  mutation:
    name: mutation testing (${{ matrix.mode }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fallback
            disable_native: "1"
            accelerated: "False"
          - mode: native
            disable_native: ""
            accelerated: "True"
    env:
      LUCEN_DISABLE_NATIVE: ${{ matrix.disable_native }}
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest hypothesis "mutmut==2.5.1"
          pip install -e .
      # A native lane that silently fell back would report the whole accelerated
      # half as survivors, which is the failure this matrix exists to prevent.
      - name: Confirm the lane is in the accel mode it claims
        run: |
          python - <<'PY'
          from lucen.execution import _accel
          expected = ${{ matrix.accelerated }}
          assert _accel.ACCELERATED is expected, (
              f"lane wanted ACCELERATED={expected}, got {_accel.ACCELERATED}"
          )
          PY
      - name: Mutate the correctness core and kill mutants with the suite
        run: |
          timeout 150m mutmut run \
            --paths-to-mutate "lucen/execution/_accel.py,lucen/execution/runtime.py,lucen/execution/planning.py,lucen/analysis/purity.py,lucen/execution/dispatch.py" \
            --runner "python -m pytest -x -q tests/unit tests/property" \
            --tests-dir "tests/" \
            --no-progress --CI || true
      - name: Survivors report
        if: always()
        run: mutmut results | tee mutation-survivors-${{ matrix.mode }}.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-survivors-${{ matrix.mode }}
          path: mutation-survivors-${{ matrix.mode }}.txt
